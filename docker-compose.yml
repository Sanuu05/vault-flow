version: '3.8'
services: 
    postgres:
       image: postgres:17
       container_name: valtflow_pg
       restart: unless-stopped
       environment:
           POSTGRES_USER: postgres
           POSTGRES_PASSWORD: postgres
           POSTGRES_DB: valtflow
       ports:
         - "54321:5432"
       volumes:  
         - postgres_data:/var/lib/postgresql/data   

volumes:
  postgres_data:

